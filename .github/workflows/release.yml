name: Release

# Push a version tag → every platform installer is built and published
# to the GitHub Releases page automatically (~15 min).
#   git tag v1.0.2 && git push origin v1.0.2

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: out/

  desktop:
    needs: build-web
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Download static build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: out/
      - name: Build installers (current OS)
        run: bunx electron-builder --config electron-builder.yml --publish never
        env:
          # Electron download mirror keeps CI stable
          ELECTRON_MIRROR: "https://github.com/electron/electron/releases/download/"
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: ignore

  android:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Download static build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: out/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Add Android platform
        run: bunx cap add android
      - name: Sync web build into the Android project
        run: bunx cap sync android
      - name: Build release APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  publish:
    needs: [build-web, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts/
      - name: Flatten installers
        run: |
          mkdir -p release
          find dist-artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.apk' \) -exec cp {} release/ \;
          ls -la release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
